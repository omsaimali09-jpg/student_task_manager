<form action="/update_student/{{ student.student_id }}" method="POST">

    <input
        type="text"
        name="first_name"
        class="form-control"
        value="{{ student.first_name }}"
    >

    <input
        type="text"
        name="last_name"
        class="form-control"
        value="{{ student.last_name }}"
    >

    <button type="submit">
        Update Student
    </button>

</form>
